name: Pin model

# Regenerates the pin model from the schematic and fails if the committed
# model/mainlite.pins.{yaml,json} is stale. Also runs KiCad ERC and uploads
# the report.

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-model-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the KiCad version of the design files (generator_version 9.0).
  KICAD_IMAGE: kicad/kicad:9.0.9@sha256:e638b79b0321f29395a5b783e94bb9f3c73303e8da15da27b8f5cb4b67a37729
  # ERC errors fail CI (warnings are reported only).
  ERC_BLOCKING: "true"

jobs:
  model:
    name: Pin model and ERC
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Export netlist and run ERC (KiCad in container)
        run: tools/kicad_export.sh

      - name: Check committed model matches the schematic
        run: python3 tools/gen_pins.py --netlist build/netlist.xml --check

      - name: Model tests
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --only-binary=:all: pyyaml==6.0.2
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -v

      - name: ERC summary
        if: ${{ !cancelled() }}
        run: |
          flag=""
          if [ "$ERC_BLOCKING" = "true" ]; then flag="--fail-on-errors"; fi
          python3 tools/erc_summary.py build/erc.json $flag >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate model for the artifact
        if: ${{ !cancelled() }}
        run: python3 tools/gen_pins.py --netlist build/netlist.xml --out-dir build/regenerated

      - name: Upload model, netlist and ERC report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pin-model-${{ github.sha }}
          path: |
            build/regenerated/model/
            build/netlist.xml
            build/erc.json
            build/erc.rpt
          if-no-files-found: warn
          retention-days: 30
